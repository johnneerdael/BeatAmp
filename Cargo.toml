[workspace]
resolver = "2"
members = ["crates/audio-analysis", "crates/android-bridge", "crates/milk-import", "crates/effect-model", "crates/effect-package", "crates/beat-authoring", "crates/milk-compile", "crates/effect-runtime", "crates/effect-render", "apps/cli", "tests/integration"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
wgpu-types = { version = "30.0.1", features = ["serde"] }
rustfft = "6.4"
crossbeam-channel = "0.5"
jni = "0.21"
sha2 = "0.10"
encoding_rs = "0.8"
clap = { version = "4.5", features = ["derive"] }
logos = "0.16"
rand_mt = { version = "6", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "metal", "vulkan", "gles", "wgsl"] }
naga = { version = "30.0.0", features = ["wgsl-in", "wgsl-out", "spv-in"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
zip = { version = "8.6.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
